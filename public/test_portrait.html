<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FFDE17; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="portraitCanvas"></canvas>
<script>
  const canvas = document.getElementById('portraitCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1920;
  canvas.height = 1080;

  let mouseX = 960, mouseY = 540;
  let curMouseX = 960, curMouseY = 540;
  let frame = 0;
  let lastBoilTime = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) * 1920;
    mouseY = (e.clientY / window.innerHeight) * 1080;
  });

  // Jitter generator for hand-drawn line boil
  function getJitter(seed) {
    const f = frame;
    const n = Math.sin(seed * 719.3 + f * 17.13) * 43758.5453;
    return (n - Math.floor(n) - 0.5) * 2.0;
  }

  function drawPortrait(now) {
    if (now - lastBoilTime > 85) {
      lastBoilTime = now;
      frame = (frame + 1) % 3;
    }

    curMouseX += (mouseX - curMouseX) * 0.1;
    curMouseY += (mouseY - curMouseY) * 0.1;

    // 1. Solid Electric Yellow Background (matching Image 3)
    ctx.fillStyle = '#FFDE17';
    ctx.fillRect(0, 0, 1920, 1080);

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const j = (seed) => getJitter(seed);

    // ==========================================
    // 2. T-SHIRT & SHOULDERS (MATCHING IMAGE 3)
    // ==========================================
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(815 + j(1), 740 + j(2));
    ctx.quadraticCurveTo(945 + j(3), 805 + j(4), 1075 + j(5), 740 + j(6));
    ctx.bezierCurveTo(1185 + j(7), 770 + j(8), 1290 + j(9), 815 + j(10), 1380 + j(11), 870 + j(12));
    ctx.quadraticCurveTo(1240 + j(13), 915 + j(14), 1090 + j(15), 920 + j(16));
    ctx.quadraticCurveTo(945 + j(17), 925 + j(18), 800 + j(19), 920 + j(20));
    ctx.quadraticCurveTo(660 + j(21), 915 + j(22), 520 + j(23), 870 + j(24));
    ctx.bezierCurveTo(610 + j(25), 815 + j(26), 715 + j(27), 770 + j(28), 815 + j(1), 740 + j(2));
    ctx.closePath();

    ctx.save();
    ctx.clip();
    // Solid black underlayer
    ctx.fillStyle = '#080808';
    ctx.fill();

    // Hand-drawn dense sketchy scribbles across the shirt (matching Image 3)
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 6;
    for (let i = 0; i < 95; i++) {
      const sx = 510 + i * 10 + j(i * 4);
      const sy = 730 + (i % 5) * 12 + j(i * 8);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + 75 + j(i * 12), sy + 150 + j(i * 14));
      ctx.stroke();
    }
    // Opposite cross-hatch strokes
    ctx.lineWidth = 4.5;
    for (let i = 0; i < 70; i++) {
      const sx = 560 + i * 12 + j(i * 6);
      const sy = 880 - (i % 6) * 16 + j(i * 10);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + 85 + j(i * 16), sy - 70 + j(i * 18));
      ctx.stroke();
    }
    ctx.restore();

    // Bold shirt shoulder outlines
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#000000';
    ctx.beginPath();
    ctx.moveTo(815 + j(1), 740 + j(2));
    ctx.bezierCurveTo(715 + j(27), 770 + j(28), 610 + j(25), 815 + j(26), 520 + j(23), 870 + j(24));
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(1075 + j(5), 740 + j(6));
    ctx.bezierCurveTo(1185 + j(7), 770 + j(8), 1290 + j(9), 815 + j(10), 1380 + j(11), 870 + j(12));
    ctx.stroke();

    // Bold curved crewneck collar line
    ctx.beginPath();
    ctx.moveTo(815 + j(1), 740 + j(2));
    ctx.quadraticCurveTo(945 + j(3), 805 + j(4), 1075 + j(5), 740 + j(6));
    ctx.lineWidth = 9;
    ctx.stroke();

    // Rough sketchy strokes along the bottom contour of shirt
    for (let x = 540; x < 1360; x += 22) {
      const edgeY = 865 + Math.sin((x - 520) / 860 * Math.PI) * 45;
      ctx.beginPath();
      ctx.moveTo(x + j(x), edgeY - 15 + j(x + 1));
      ctx.lineTo(x + 16 + j(x + 2), edgeY + 12 + j(x + 3));
      ctx.lineWidth = 6;
      ctx.stroke();
    }
    ctx.restore();

    // ==========================================
    // 3. NECK
    // ==========================================
    ctx.lineWidth = 9;
    ctx.strokeStyle = '#000000';
    // Left neck line
    ctx.beginPath();
    ctx.moveTo(855 + j(41), 660 + j(42));
    ctx.quadraticCurveTo(845 + j(43), 700 + j(44), 840 + j(45), 748 + j(46));
    ctx.stroke();

    // Right neck line
    ctx.beginPath();
    ctx.moveTo(1035 + j(47), 660 + j(48));
    ctx.quadraticCurveTo(1045 + j(49), 700 + j(50), 1050 + j(51), 748 + j(52));
    ctx.stroke();

    // ==========================================
    // 4. EARS
    // ==========================================
    // Left ear (bold round loop)
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(795 + j(61), 475 + j(62));
    ctx.bezierCurveTo(745 + j(63), 480 + j(64), 745 + j(65), 555 + j(66), 800 + j(67), 570 + j(68));
    ctx.stroke();
    // Inner left ear crease
    ctx.lineWidth = 5.5;
    ctx.beginPath();
    ctx.moveTo(775 + j(69), 500 + j(70));
    ctx.quadraticCurveTo(762 + j(71), 530 + j(72), 785 + j(73), 548 + j(74));
    ctx.stroke();

    // Right ear
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(1095 + j(81), 450 + j(82));
    ctx.bezierCurveTo(1150 + j(83), 455 + j(84), 1150 + j(85), 530 + j(86), 1095 + j(87), 545 + j(88));
    ctx.stroke();
    // Inner right ear crease
    ctx.lineWidth = 5.5;
    ctx.beginPath();
    ctx.moveTo(1115 + j(89), 475 + j(90));
    ctx.quadraticCurveTo(1128 + j(91), 505 + j(92), 1105 + j(93), 522 + j(94));
    ctx.stroke();

    // ==========================================
    // 5. BEARD & JAWLINE (EXACT MATCH TO IMAGE 3)
    // ==========================================
    ctx.save();
    ctx.beginPath();
    // Outer jawline
    ctx.moveTo(795 + j(101), 530 + j(102));
    ctx.quadraticCurveTo(810 + j(103), 635 + j(104), 865 + j(105), 685 + j(106));
    ctx.quadraticCurveTo(945 + j(107), 715 + j(108), 1025 + j(109), 685 + j(110));
    ctx.quadraticCurveTo(1080 + j(111), 635 + j(112), 1095 + j(113), 515 + j(114));
    // Inner beard boundary (under cheeks and mouth)
    ctx.quadraticCurveTo(1065 + j(115), 555 + j(116), 1030 + j(117), 575 + j(118));
    ctx.quadraticCurveTo(985 + j(119), 630 + j(120), 945 + j(121), 635 + j(122));
    ctx.quadraticCurveTo(905 + j(123), 630 + j(124), 860 + j(125), 575 + j(126));
    ctx.quadraticCurveTo(825 + j(127), 555 + j(128), 795 + j(101), 530 + j(102));
    ctx.closePath();

    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#080808';
    ctx.fill();

    // Sketched beard hair texture
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4.5;
    for (let b = 0; b < 160; b++) {
      const bx = 800 + (b % 38) * 8 + j(b * 5);
      const by = 530 + Math.floor(b / 38) * 35 + j(b * 7);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + 4 + j(b * 9), by + 16 + j(b * 11));
      ctx.stroke();
    }
    ctx.restore();

    // Rough sketchy outer hair strokes on jawline
    ctx.lineWidth = 6.5;
    ctx.strokeStyle = '#000000';
    for (let i = 0; i < 40; i++) {
      const t = i / 40;
      const bx = 795 * (1 - t) * (1 - t) + 945 * 2 * (1 - t) * t + 1095 * t * t;
      const by = 530 * (1 - t) * (1 - t) + 740 * 2 * (1 - t) * t + 515 * t * t;
      ctx.beginPath();
      ctx.moveTo(bx + j(i * 5), by + j(i * 7));
      ctx.lineTo(bx + 3 + j(i * 11), by + 9 + j(i * 13));
      ctx.stroke();
    }
    ctx.restore();

    // ==========================================
    // 6. MOUTH, MUSTACHE & SOUL PATCH (IMAGE 3)
    // ==========================================
    // Full styled mustache
    ctx.beginPath();
    ctx.moveTo(885 + j(161), 580 + j(162));
    ctx.quadraticCurveTo(920 + j(163), 545 + j(164), 945 + j(165), 545 + j(166));
    ctx.quadraticCurveTo(970 + j(167), 545 + j(168), 1005 + j(169), 580 + j(170));
    ctx.quadraticCurveTo(970 + j(171), 592 + j(172), 945 + j(173), 578 + j(174));
    ctx.quadraticCurveTo(920 + j(175), 592 + j(176), 885 + j(177), 580 + j(178));
    ctx.closePath();
    ctx.fillStyle = '#080808';
    ctx.fill();
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    // Mouth parting line
    ctx.beginPath();
    ctx.moveTo(905 + j(181), 588 + j(182));
    ctx.quadraticCurveTo(945 + j(183), 592 + j(184), 985 + j(185), 588 + j(186));
    ctx.lineWidth = 7;
    ctx.stroke();

    // Soul patch under lip
    ctx.beginPath();
    ctx.arc(945 + j(191), 614 + j(192), 7.5, 0, Math.PI * 2);
    ctx.fillStyle = '#080808';
    ctx.fill();

    // ==========================================
    // 7. NOSE (IMAGE 3)
    // ==========================================
    ctx.beginPath();
    ctx.moveTo(942 + j(141), 475 + j(142));
    ctx.lineTo(928 + j(143), 532 + j(144));
    ctx.lineTo(956 + j(145), 535 + j(146));
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    // Small nostril hook
    ctx.beginPath();
    ctx.arc(962 + j(149), 528 + j(150), 3.8, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    // ==========================================
    // 8. EYEBROWS (EXPRESSIVE, AS IN IMAGE 3)
    // ==========================================
    // Left eyebrow
    ctx.beginPath();
    ctx.moveTo(830 + j(201), 446 + j(202));
    ctx.quadraticCurveTo(865 + j(203), 426 + j(204), 915 + j(205), 438 + j(206));
    ctx.quadraticCurveTo(865 + j(207), 434 + j(208), 830 + j(209), 446 + j(210));
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.lineWidth = 9;
    ctx.stroke();

    // Right eyebrow
    ctx.beginPath();
    ctx.moveTo(972 + j(211), 425 + j(212));
    ctx.quadraticCurveTo(1015 + j(213), 405 + j(214), 1065 + j(215), 422 + j(216));
    ctx.quadraticCurveTo(1015 + j(217), 415 + j(218), 972 + j(219), 425 + j(220));
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.lineWidth = 9;
    ctx.stroke();

    // ==========================================
    // 9. EYES & PUPILS (REAL-TIME CURSOR TRACKING)
    // ==========================================
    // LEFT EYE
    const leftEyeCenter = { x: 872, y: 476 };
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(840 + j(221), 476 + j(222));
    ctx.quadraticCurveTo(872 + j(223), 456 + j(224), 906 + j(225), 476 + j(226));
    ctx.quadraticCurveTo(872 + j(227), 494 + j(228), 840 + j(229), 476 + j(230));
    ctx.closePath();

    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 6.5;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    ctx.clip();

    // Dynamic pupil tracking
    const ldx = curMouseX - leftEyeCenter.x;
    const ldy = curMouseY - leftEyeCenter.y;
    const lAngle = Math.atan2(ldy, ldx);
    const lDist = Math.min(9, Math.hypot(ldx, ldy) * 0.016);
    const lPupilX = leftEyeCenter.x + Math.cos(lAngle) * lDist;
    const lPupilY = leftEyeCenter.y + Math.sin(lAngle) * (lDist * 0.55);

    ctx.beginPath();
    ctx.arc(lPupilX + j(231), lPupilY + j(232), 11, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(lPupilX - 3.2, lPupilY - 3.2, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    // Upper eyelid stroke (Left)
    ctx.beginPath();
    ctx.moveTo(837 + j(235), 478 + j(236));
    ctx.quadraticCurveTo(872 + j(237), 454 + j(238), 908 + j(239), 475 + j(240));
    ctx.lineWidth = 8;
    ctx.stroke();

    // RIGHT EYE
    const rightEyeCenter = { x: 1018, y: 462 };
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(986 + j(241), 462 + j(242));
    ctx.quadraticCurveTo(1018 + j(243), 442 + j(244), 1052 + j(245), 462 + j(246));
    ctx.quadraticCurveTo(1018 + j(247), 480 + j(248), 986 + j(249), 462 + j(250));
    ctx.closePath();

    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 6.5;
    ctx.strokeStyle = '#000000';
    ctx.stroke();

    ctx.clip();

    // Dynamic right pupil tracking
    const rdx = curMouseX - rightEyeCenter.x;
    const rdy = curMouseY - rightEyeCenter.y;
    const rAngle = Math.atan2(rdy, rdx);
    const rDist = Math.min(9, Math.hypot(rdx, rdy) * 0.016);
    const rPupilX = rightEyeCenter.x + Math.cos(rAngle) * rDist;
    const rPupilY = rightEyeCenter.y + Math.sin(rAngle) * (rDist * 0.55);

    ctx.beginPath();
    ctx.arc(rPupilX + j(251), rPupilY + j(252), 11, 0, Math.PI * 2);
    ctx.fillStyle = '#000000';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(rPupilX - 3.2, rPupilY - 3.2, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();

    // Upper eyelid stroke (Right)
    ctx.beginPath();
    ctx.moveTo(983 + j(255), 464 + j(256));
    ctx.quadraticCurveTo(1018 + j(257), 440 + j(258), 1054 + j(259), 461 + j(260));
    ctx.lineWidth = 8;
    ctx.stroke();

    // ==========================================
    // 10. HAIR (IMAGE 3 ACCURATE SPIKES & SILHOUETTE)
    // ==========================================
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(795 + j(271), 475 + j(272));
    // Left side spikes curving up
    ctx.lineTo(765 + j(273), 435 + j(274));
    ctx.lineTo(775 + j(275), 405 + j(276));
    ctx.lineTo(752 + j(277), 375 + j(278));
    ctx.lineTo(772 + j(279), 350 + j(280));
    ctx.lineTo(760 + j(281), 320 + j(282));
    ctx.lineTo(790 + j(283), 285 + j(284));
    ctx.lineTo(815 + j(285), 260 + j(286));
    // Top crown with messy natural spikes
    ctx.lineTo(845 + j(287), 245 + j(288));
    ctx.lineTo(860 + j(289), 230 + j(290));
    ctx.lineTo(890 + j(291), 220 + j(292));
    ctx.lineTo(915 + j(293), 205 + j(294));
    ctx.lineTo(940 + j(295), 220 + j(296));
    ctx.lineTo(975 + j(297), 208 + j(298));
    ctx.lineTo(1005 + j(299), 225 + j(300));
    ctx.lineTo(1040 + j(301), 215 + j(302));
    ctx.lineTo(1075 + j(303), 245 + j(304));
    ctx.lineTo(1105 + j(305), 275 + j(306));
    // Right side spikes curving down to ear
    ctx.lineTo(1140 + j(307), 310 + j(308));
    ctx.lineTo(1125 + j(309), 340 + j(310));
    ctx.lineTo(1155 + j(311), 365 + j(312));
    ctx.lineTo(1135 + j(313), 395 + j(314));
    ctx.lineTo(1150 + j(315), 420 + j(316));
    ctx.lineTo(1115 + j(317), 445 + j(318));
    ctx.lineTo(1095 + j(319), 455 + j(320));
    // Forehead hairline with sweeping fringe strands
    ctx.lineTo(1065 + j(321), 415 + j(322));
    ctx.quadraticCurveTo(1015 + j(323), 365 + j(324), 945 + j(325), 375 + j(326));
    ctx.quadraticCurveTo(880 + j(327), 370 + j(328), 820 + j(329), 430 + j(330));
    ctx.closePath();

    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#080808';
    ctx.fill();

    // Internal sketchy texture strokes clipped inside the hair
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 5.5;
    for (let h = 0; h < 95; h++) {
      const hx = 760 + (h % 30) * 13 + j(h * 4);
      const hy = 210 + Math.floor(h / 30) * 50 + j(h * 6);
      ctx.beginPath();
      ctx.moveTo(hx, hy);
      ctx.quadraticCurveTo(hx + 18 + j(h * 8), hy + 22 + j(h * 10), hx + 35 + j(h * 12), hy + 40 + j(h * 14));
      ctx.stroke();
    }
    ctx.restore();

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#000000';
    ctx.stroke();
    ctx.restore();

    // Fringe spikes sweeping diagonally over forehead (Image 3)
    ctx.lineWidth = 7;
    const fringes = [
      [875, 375, 900, 415, 915, 380],
      [920, 378, 945, 425, 960, 385],
      [965, 380, 990, 418, 1005, 385],
      [1010, 380, 1030, 410, 1045, 395]
    ];
    fringes.forEach(([x1, y1, x2, y2, x3, y3], idx) => {
      ctx.beginPath();
      ctx.moveTo(x1 + j(340 + idx * 3), y1 + j(341 + idx * 3));
      ctx.lineTo(x2 + j(342 + idx * 3), y2 + j(343 + idx * 3));
      ctx.lineTo(x3 + j(344 + idx * 3), y3 + j(345 + idx * 3));
      ctx.fillStyle = '#080808';
      ctx.fill();
      ctx.stroke();
    });

    ctx.restore();
    requestAnimationFrame(drawPortrait);
  }

  requestAnimationFrame(drawPortrait);
</script>
</body>
</html>
