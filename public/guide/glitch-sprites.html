<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guide / GLITCH sprite sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 32px; background: #eeece5; color: #121316; font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; }
        .sheet { display: flex; flex-wrap: wrap; gap: 28px; }
        figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
        figure.dark canvas { background: #000; }
        .sheet canvas { width: 104px; height: 128px; image-rendering: pixelated; background: #f4f2ea; box-shadow: 0 0 0 1px rgba(18,19,22,0.15); }
    </style>
</head>
<body class="is-loaded">
    <div class="sheet" id="sheet"></div>
    <script>window.__pixelBugDebug = true;</script>
    <script src="/js/pixel-bug.js"></script>
    <script>
        (function wait() {
            const d = window.__pixelBugDebug;
            if (!d || d === true) return setTimeout(wait, 50);
            const skins = d.SKINS || ['beetle'];
            const sheet = document.getElementById('sheet');
            skins.forEach((skin) => {
            const head = document.createElement('h2');
            head.textContent = skin;
            head.style.cssText = 'flex-basis: 100%; margin: 12px 0 0; font-size: 12px; letter-spacing: 0.24em;';
            sheet.appendChild(head);
            const base = { skin, legs: 'stand', antL: 'out', antR: 'out', fly: 0, belly: false, happy: false, lit: skin === 'firefly' };
            const poses = [
                ['idle', {}],
                ['walk a', { legs: 'a' }],
                ['walk b', { legs: 'b' }],
                ['twitch', { antL: 'up' }],
                ['groom', { legs: 'groomL', antL: 'down' }],
                ['fly', { fly: 1, legs: 'tuck', antL: 'wide', antR: 'wide' }],
                ['fly buzz', { fly: 2, legs: 'tuck', antL: 'wide', antR: 'wide' }],
                ['caught', { happy: true, antL: 'up', antR: 'up' }],
                ['flipped', { belly: true, legs: 'flail0', antL: 'wide', antR: 'wide' }],
                ['sleep', { legs: 'tuck', antL: 'down', antR: 'down' }],
                ['idle / dark', {}, true],
                ['fly / dark', { fly: 1, legs: 'tuck', antL: 'wide', antR: 'wide' }, true],
            ];
            poses.forEach(([name, p, dark]) => {
                const fig = document.createElement('figure');
                if (dark) fig.className = 'dark';
                const c = document.createElement('canvas');
                c.width = d.GW + 2;
                c.height = d.GH + 2;
                c.getContext('2d').drawImage(d.compose(Object.assign({}, base, p)).img, 1, 1);
                const cap = document.createElement('figcaption');
                cap.textContent = name;
                fig.append(c, cap);
                sheet.appendChild(fig);
            });
            });
        })();
    </script>
</body>
</html>
