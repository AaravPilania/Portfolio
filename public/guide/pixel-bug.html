<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide / GLITCH the pixel bug</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../motion/motion-core.css">
    <style>
        .mp-dock, .mp-dock.is-visible { left: 16px; top: 16px; bottom: auto; transform: none; }
        .mp-dock a { color: #FFED29; }
        .pk-skins { display: inline-flex; gap: 4px; }
        .pk-skins button { appearance: none; border: 0; cursor: pointer; padding: 1px 6px; font: inherit; letter-spacing: inherit; text-transform: uppercase;
            color: inherit; background: transparent; box-shadow: inset 0 0 0 1px rgba(244, 242, 234, 0.3); }
        .pk-skins button.is-on { background: #FFED29; color: #121316; box-shadow: none; }
    </style>
</head>
<body>
    <iframe id="siteFrame" src="/index.html" title="Portfolio"></iframe>
    <nav class="mp-dock" id="mpDock" aria-label="Guide prototype">
        <b><span>BUG</span> pixel guide</b>
        <b class="pk-skins">
            <button type="button" data-skin="beetle">glitch</button>
            <button type="button" data-skin="firefly">spark</button>
            <button type="button" data-skin="stag">pinch</button>
            <button type="button" data-skin="moth">dust</button>
        </b>
        <b>boop / drag + drop / fast-scroll to make it fly / <a href="/guide/bug-picker.html">pick + finalise</a></b>
    </nav>
    <script>
        // Skips the site intro inside the frame, then drops the bug script into the real page
        (function () {
            const frame = document.getElementById('siteFrame');
            const skinButtons = [...document.querySelectorAll('.pk-skins button')];
            function mark(key) { skinButtons.forEach((b) => b.classList.toggle('is-on', b.dataset.skin === key)); }
            let initial = 'beetle';
            try { initial = localStorage.getItem('pixelBugSkin') || 'beetle'; } catch (e) { /* storage blocked */ }
            mark(initial);
            skinButtons.forEach((b) => b.addEventListener('click', () => {
                const w = frame.contentWindow;
                if (w && w.__pixelBugSetSkin) w.__pixelBugSetSkin(b.dataset.skin);
                mark(b.dataset.skin);
            }));
            function claim() {
                const w = frame.contentWindow;
                try {
                    if (w && typeof w.__setIntroManual === 'function' && typeof w.__renderIntroAt === 'function' &&
                        w.document.readyState !== 'loading' && w.__heroAvatarEngine) {
                        w.__setIntroManual();
                        w.__renderIntroAt(99);
                        w.document.body.classList.add('is-loaded');
                        w.dispatchEvent(new w.CustomEvent('intro-complete'));
                        const s = w.document.createElement('script');
                        s.src = '/js/pixel-bug.js';
                        w.document.body.appendChild(s);
                        document.getElementById('mpDock').classList.add('is-visible');
                        // The site pins GLITCH; swap to the stored pick once its bug has mounted
                        (function applyPick() {
                            if (w.__pixelBugSetSkin) w.__pixelBugSetSkin(initial);
                            else setTimeout(applyPick, 200);
                        })();
                        return;
                    }
                } catch (e) { /* not ready */ }
                setTimeout(claim, 80);
            }
            claim();
        })();
    </script>
</body>
</html>
