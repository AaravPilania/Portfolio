<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide / BYTE the pixel dog</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../motion/motion-core.css">
    <style>
        .mp-dock, .mp-dock.is-visible { left: 16px; top: 16px; bottom: auto; transform: none; }
    </style>
</head>
<body>
    <iframe id="siteFrame" src="/index.html" title="Portfolio"></iframe>
    <nav class="mp-dock" id="mpDock" aria-label="Guide prototype">
        <b><span>BYTE</span> pixel guide</b>
        <b>click to pet / drag to carry / idle 18s to nap</b>
    </nav>
    <script>
        // Skips the site intro inside the frame, then drops the dog script into the real page
        (function () {
            const frame = document.getElementById('siteFrame');
            function claim() {
                const w = frame.contentWindow;
                try {
                    if (w && typeof w.__setIntroManual === 'function' && typeof w.__renderIntroAt === 'function' &&
                        w.document.readyState !== 'loading' && w.__heroAvatarEngine) {
                        w.__setIntroManual();
                        w.__renderIntroAt(99);
                        w.document.body.classList.add('is-loaded');
                        w.dispatchEvent(new w.CustomEvent('intro-complete'));
                        const s = w.document.createElement('script');
                        s.src = '/js/pixel-dog.js';
                        w.document.body.appendChild(s);
                        document.getElementById('mpDock').classList.add('is-visible');
                        return;
                    }
                } catch (e) { /* not ready */ }
                setTimeout(claim, 80);
            }
            claim();
        })();
    </script>
</body>
</html>
