<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Lab / 06 Meer study</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Ruthie&family=Stack+Sans+Headline:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/guide/projects-lab/lab.css">
    <style>
        body { background: #000; overflow-x: hidden; }

        .m6-intro { min-height: 78vh; padding: calc(var(--pad) * 2) var(--pad) 8vh; display: flex; flex-direction: column; justify-content: space-between; }
        .m6-intro h1 { margin: 14px 0 0; font: 200 clamp(44px, 7vw, 128px)/0.95 'Stack Sans Headline', var(--sans); letter-spacing: -0.03em; }
        .m6-intro h1 em { font: 400 0.62em/1 'Ruthie', cursive; color: var(--sig); letter-spacing: 0; margin-left: 0.1em; }
        .m6-intro__row { display: flex; justify-content: space-between; align-items: end; gap: 4vw; color: var(--dim); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; line-height: 1.8; }
        .m6-intro__row p { margin: 0; max-width: 42ch; }
        .m6-intro__row a { color: var(--paper); }

        .m6 { position: relative; height: calc(var(--n, 16) * 100vh + 100vh); }
        .m6-pin { position: sticky; top: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Stack Sans Headline', var(--sans); }
        .m6-bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: blur(20px); transform: scale(1.15); opacity: 0; transition: opacity 0.5s linear; pointer-events: none; }
        .m6-shade { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.22); pointer-events: none; }

        .m6-steps { position: absolute; inset: 0; }
        .m6-step { position: absolute; top: 0; left: 28vw; width: 45vw; height: 50vh; background: #222; overflow: hidden; transform-origin: 50% 50%; will-change: transform, opacity; pointer-events: none; }
        .m6-step.is-active { pointer-events: auto; }
        .m6-media, .m6-media img, .m6-media video, .m6-reveal { position: absolute; inset: 0; width: 100%; height: 100%; }
        .m6-media img, .m6-media video { object-fit: cover; }
        .m6-media video { opacity: 0; }
        .m6-step.has-video .m6-media video { opacity: 1; }
        .m6-media { opacity: 0; }
        .m6-step.is-sharp .m6-media { opacity: 1; }
        .m6-step.is-sharp .m6-reveal { opacity: 0; }

        .m6-text { position: absolute; left: 0; top: 50%; z-index: 100; width: 100%; padding: 3rem; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; color: #fff; transform: translate3d(0, -50%, 0); pointer-events: none; user-select: none; }
        .m6-text h1, .m6-text p { position: relative; overflow: hidden; margin: 0 0.3rem 0 0; font-weight: 200; }
        .m6-text h1 { padding-left: 3rem; font: 400 3rem/1.15 'Stack Sans Headline', var(--sans); text-transform: uppercase; }
        .m6-text p { width: 20%; padding-right: 5rem; font: 200 1rem/1.5 'Stack Sans Headline', var(--sans); }
        .m6-word { display: inline-block; margin-right: 0.35em; opacity: 0; transform: translate3d(0, 40px, 0); transition-property: transform, opacity; transition-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); }
        .m6-word:last-child { margin-right: 0; }
        .is-in > .m6-word { opacity: 1; transform: translate3d(0, 0, 0); }
        .m6-ring { position: absolute; right: 3%; bottom: 20%; z-index: 200; width: 20vh; height: 20vh; display: flex; justify-content: center; align-items: center; }
        .m6-ring__c { position: relative; width: 100px; height: 100px; display: flex; justify-content: center; align-items: center; }
        .m6-ring svg { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-40%, -60%) rotate(-90deg); overflow: visible; }
        .m6-ring circle { fill: none; stroke: #fff; stroke-width: 1; }
        .m6-ring h2 { position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); color: #fff; font: 400 2rem/1 'Ruthie', cursive; pointer-events: none; user-select: none; }

        .m6-view { position: fixed; left: 0; top: 0; z-index: 50000; width: 80px; height: 70px; display: flex; justify-content: center; align-items: center; pointer-events: none; opacity: 0; transition: opacity 0.6s cubic-bezier(0.215, 0.61, 0.355, 1); will-change: transform, opacity; }
        .m6-view.is-on { opacity: 1; transition-duration: 0.4s; transition-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .m6-view span { position: relative; font: 400 1.5rem/1 'Ruthie', cursive; color: var(--sig); }
        .m6-view svg { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; animation: m6-spin 12s linear infinite; }
        .m6-view text { font: 500 8.6px/1 var(--mono); letter-spacing: 0.32em; fill: var(--sig); text-transform: uppercase; }
        @keyframes m6-spin { to { transform: rotate(360deg); } }

        .m6-foot { padding: 16vh var(--pad) 22vh; display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; }

        .pl-reduced .m6-view svg { animation: none; }
        .pl-reduced .m6-word { transition: none; }

        @media (max-width: 800px) {
            .m6-step { width: 90vw; left: 5vw; height: 45vh; }
            .m6-text { flex-direction: column; justify-content: center; padding: 0; }
            .m6-text h1 { padding-left: 0; font-size: 2.6rem; text-align: center; }
            .m6-text p { width: 90%; padding: 0; text-align: center; }
            .m6-ring { right: 50%; transform: translate(50%); }
        }
    </style>
</head>
<body>
    <header class="m6-intro">
        <div>
            <p class="pl-kicker">Slide 03 &mdash; Meer study</p>
            <h1>One project at a time, <em>stacked</em></h1>
        </div>
        <div class="m6-intro__row">
            <p>Layout and scroll choreography after <a href="https://meermohsin.me/" target="_blank" rel="noopener">meermohsin.me</a>. Every next project arrives through our row-hover reveal: noise blocks dissolve in while the mosaic resolves.</p>
            <span>Scroll &darr;</span>
        </div>
    </header>

    <section class="m6" id="m6" aria-label="Selected work">
        <div class="m6-pin">
            <canvas class="m6-bg" id="m6Bg" aria-hidden="true"></canvas>
            <div class="m6-shade" aria-hidden="true"></div>
            <div class="m6-steps" id="m6Steps"></div>
            <div class="m6-text" aria-live="polite">
                <h1 id="m6Title" class="is-in"><span class="m6-word">My</span><span class="m6-word">work</span></h1>
                <p id="m6Desc" class="is-in"><span class="m6-word">Scroll</span><span class="m6-word">down</span><span class="m6-word">for</span><span class="m6-word">more</span></p>
            </div>
            <div class="m6-ring" aria-hidden="true">
                <div class="m6-ring__c">
                    <svg viewBox="0 0 80 80"><circle id="m6RingCircle" cx="40" cy="40" r="35"/></svg>
                    <h2 id="m6Num">01</h2>
                </div>
            </div>
        </div>
    </section>

    <footer class="m6-foot"><span>16 projects &middot; 2019&ndash;2025</span><span>End of reel</span></footer>

    <div class="m6-view" id="m6View" aria-hidden="true">
        <svg viewBox="0 0 132 132">
            <defs><path id="m6ViewPath" d="M66,66 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
            <text><textPath href="#m6ViewPath">Open project &middot; Open project &middot; Open project &middot;</textPath></text>
        </svg>
        <span>View</span>
    </div>

    <script src="/guide/projects-lab/data.js"></script>
    <script src="/guide/projects-lab/lab.js"></script>
    <script src="/guide/projects-lab/d06-meer.js"></script>
</body>
</html>
