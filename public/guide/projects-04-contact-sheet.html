<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Lab / 04 Contact Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/guide/projects-lab/lab.css">
    <style>
        html { scrollbar-gutter: stable; }
        html, body { background: #eeece4; color: var(--ink); }
        .site-cursor-dot { box-shadow: 0 0 0 3px rgba(18, 19, 22, 0.55); transition: opacity 0.3s linear, background-color 0.25s linear, box-shadow 0.3s linear; }
        .site-cursor-dot.is-ring { box-shadow: 0 0 0 1px rgba(18, 19, 22, 0.55), inset 0 0 0 1px rgba(18, 19, 22, 0.55); }
        body::before { content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: linear-gradient(to right, rgba(18,19,22,0.11) 1px, transparent 1px), linear-gradient(to bottom, rgba(18,19,22,0.11) 1px, transparent 1px),
                linear-gradient(to right, rgba(18,19,22,0.045) 1px, transparent 1px), linear-gradient(to bottom, rgba(18,19,22,0.045) 1px, transparent 1px);
            background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px; background-position: -1px -1px; }
        .pl-grain { mix-blend-mode: multiply; opacity: 0.18; }
        .cs { position: relative; z-index: 1; padding: calc(var(--pad) * 2) var(--pad) 22vh; }
        .cs-head { display: grid; grid-template-columns: 1fr auto; gap: 4vw; align-items: end; padding-bottom: 5vw; border-bottom: 1.5px solid var(--ink); margin-bottom: 5vw; }
        .cs-head .pl-kicker { color: var(--ink); }
        .cs-head .pl-kicker span { background: var(--sig); padding: 2px 6px; }
        .cs-title { margin: 18px 0 0; font: 600 clamp(64px, 13vw, 230px)/0.8 var(--sans); letter-spacing: -0.06em; text-transform: uppercase; }
        .cs-title em { font: italic 300 0.62em/1 var(--serif); text-transform: none; letter-spacing: -0.03em; margin-left: 0.1em; }
        .cs-spec { margin: 0; display: grid; grid-template-columns: auto auto; gap: 6px 24px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; }
        .cs-spec dt { color: #6d6a62; }
        .cs-spec dd { margin: 0; }

        .cs-sheet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(28px, 4vw, 72px) clamp(20px, 3vw, 56px); align-items: start; }
        .cs-print { position: relative; display: block; width: 100%; text-align: left; }
        .cs-print__body { position: relative; display: block; background: #fbfaf5; padding: 10px 10px 44px;
            transform: rotate(var(--r)); transition: transform 0.7s var(--ease-out);
            box-shadow: 0 1px 0 rgba(18,19,22,0.08), 0 10px 18px -12px rgba(18,19,22,0.45); }
        .cs-print__body::after { content: ''; position: absolute; inset: 0; box-shadow: 0 30px 40px -18px rgba(18,19,22,0.5); opacity: 0; transition: opacity 0.5s linear; pointer-events: none; }
        .cs-print.is-hover .cs-print__body { transform: rotate(0deg) translate3d(0, -8px, 0) scale(1.03); }
        .cs-print.is-hover .cs-print__body::after { opacity: 1; }
        .cs-sheet.has-hover .cs-print:not(.is-hover) .cs-print__photo { filter: grayscale(1) contrast(1.1); }
        .cs-print__photo { position: relative; display: block; width: 100%; aspect-ratio: var(--ar, 4 / 3); background: var(--ink); overflow: hidden; transition: filter 0.5s linear; }
        .cs-print__photo .pl-media { position: absolute; inset: 0; }
        .cs-print__ghost { display: grid; place-items: center; width: 100%; aspect-ratio: var(--ar, 4 / 3); outline: 1.5px dashed rgba(18,19,22,0.4); outline-offset: -1px; font-size: 10px; letter-spacing: 0.24em; color: #6d6a62; text-transform: uppercase; }
        .cs-print__cap { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; gap: 10px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
        .cs-print__cap b { font-weight: 500; }
        .cs-print__cap i { font-style: normal; color: #6d6a62; overflow: hidden; text-overflow: ellipsis; }
        .cs-tape { position: absolute; top: -12px; left: 50%; width: 78px; height: 24px; margin-left: -39px; transform: rotate(var(--tr, -3deg)); background: rgba(255, 237, 41, 0.72); mix-blend-mode: multiply; z-index: 2;
            clip-path: polygon(3% 0, 97% 4%, 100% 50%, 96% 100%, 2% 96%, 0 48%); }
        .cs-stamp { position: absolute; right: -14px; top: -16px; z-index: 3; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
            border: 2px solid rgba(196, 34, 24, 0.82); color: rgba(196, 34, 24, 0.86); font: 600 17px/1 var(--sans); letter-spacing: -0.04em;
            transform: rotate(var(--sr, 12deg)); filter: url(#ink); mix-blend-mode: multiply; pointer-events: none; }
        .cs-stamp::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; border: 1px solid currentColor; }
        .cs-aw { position: absolute; left: 10px; bottom: 30px; display: flex; gap: 4px; z-index: 2; }
        .cs-aw span { font-size: 9px; letter-spacing: 0.16em; padding: 2px 5px 1px; background: var(--ink); color: var(--sig); }

        .cs-foot { margin-top: 10vh; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #6d6a62; border-top: 1.5px solid var(--ink); padding-top: 14px; }

        .cs-detail { position: fixed; inset: 0; z-index: 3000; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 4vw; padding: 9vh var(--pad) 14vh; visibility: hidden; }
        .cs-detail.is-open { visibility: visible; }
        .cs-detail__bg { position: absolute; inset: 0; background: rgba(238, 236, 228, 0.94); opacity: 0; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .cs-detail__slot { position: relative; align-self: stretch; min-height: 0; }
        .cs-detail__slot .cs-print__photo { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; box-shadow: 0 40px 60px -30px rgba(18,19,22,0.6); }
        .cs-detail__info { position: relative; align-self: end; display: grid; gap: 22px; }
        .cs-detail__info > * { opacity: 0; }
        .cs-detail__no { font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase; }
        .cs-detail__no b { background: var(--sig); padding: 2px 6px; font-weight: 500; }
        .cs-detail__title { margin: 0; font: 600 clamp(44px, 6vw, 110px)/0.86 var(--sans); letter-spacing: -0.055em; }
        .cs-detail__meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
        .cs-detail__meta dt { color: #6d6a62; }
        .cs-detail__meta dd { margin: 0; }
        .cs-detail__stamps { display: flex; gap: 14px; flex-wrap: wrap; min-height: 64px; align-items: center; }
        .cs-detail__stamps a { position: relative; display: inline-block; padding: 8px 12px 7px; border: 2px solid rgba(196,34,24,0.85); color: rgba(196,34,24,0.9); font: 600 16px/1 var(--sans); letter-spacing: 0.02em; filter: url(#ink); mix-blend-mode: multiply; transform: rotate(var(--sr)); }
        .cs-detail__stamps a:nth-child(2n) { border-color: var(--ink); color: var(--ink); }
        .cs-detail__actions { display: flex; gap: 12px; }
        .cs-btn { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 13px 18px 12px; box-shadow: inset 0 0 0 1.5px var(--ink); transition: background-color 0.2s linear, color 0.2s linear; }
        .cs-btn:hover, .cs-btn:focus-visible { background: var(--ink); color: var(--sig); outline: none; }
        .cs-btn--sig { background: var(--sig); box-shadow: inset 0 0 0 1.5px var(--ink); }

        @media (max-width: 1000px) { .cs-sheet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 700px) {
            .cs-sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .cs-head { grid-template-columns: 1fr; }
            .cs-detail { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
            <feComponentTransfer in="n" result="speck"><feFuncA type="discrete" tableValues="1 1 1 0 1 1 1 1"/></feComponentTransfer>
            <feComposite in="d" in2="speck" operator="in"/>
        </filter>
    </svg>
    <main class="cs">
        <header class="cs-head">
            <div>
                <p class="pl-kicker"><span>Slide 03</span> &nbsp;Archive box &mdash; selected works</p>
                <h1 class="cs-title">Contact <em>sheet</em></h1>
            </div>
            <dl class="cs-spec">
                <dt>Roll</dt><dd>RB&ndash;16</dd>
                <dt>Frames</dt><dd>16 / 16</dd>
                <dt>Span</dt><dd>2019 &rarr; 2025</dd>
                <dt>Marked</dt><dd>FWA &middot; SOTD &middot; Webby</dd>
            </dl>
        </header>
        <section class="cs-sheet" id="csSheet"></section>
        <footer class="cs-foot"><span>Click a frame to pull the print</span><span>Esc to file it back</span></footer>
    </main>

    <div class="cs-detail" id="csDetail" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="csDTitle">
        <div class="cs-detail__bg" id="csBg"></div>
        <div class="cs-detail__slot" id="csSlot"></div>
        <div class="cs-detail__info" id="csInfo">
            <div class="cs-detail__no" id="csDNo"></div>
            <h2 class="cs-detail__title" id="csDTitle"></h2>
            <dl class="cs-detail__meta" id="csDMeta"></dl>
            <div class="cs-detail__stamps" id="csDStamps"></div>
            <div class="cs-detail__actions">
                <a class="cs-btn cs-btn--sig" id="csDLaunch" target="_blank" rel="noopener" data-cursor="LAUNCH">Launch &#8599;</a>
                <button class="cs-btn" id="csDClose" type="button" data-cursor="FILE BACK">File back &times;</button>
            </div>
        </div>
    </div>

    <script src="/js/gsap.min.js"></script>
    <script src="/js/ScrollTrigger.min.js"></script>
    <script src="/js/Flip.min.js"></script>
    <script src="/guide/projects-lab/data.js"></script>
    <script src="/guide/projects-lab/lab.js"></script>
    <script src="/guide/projects-lab/d04-contact-sheet.js"></script>
</body>
</html>
