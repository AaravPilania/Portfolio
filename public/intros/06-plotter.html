<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro 06 — Plotter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro-core.css">
</head>
<body>
    <script id="introFrag" type="x-shader/x-fragment">
        uniform float uPaper;
        uniform float uSolid;
        uniform float uStamp;
        uniform float uReveal;

        float hairline(float d) { return clamp(1.0 - d * uDpr, 0.0, 1.0); }

        // The drawing sheet: graph paper, registration crosses, the pen-traced and hatched AP
        vec3 sheet(vec2 p) {
            vec2 g1 = abs(fract(p / 24.0 + 0.5) - 0.5) * 24.0;
            vec2 g2 = abs(fract(p / 120.0 + 0.5) - 0.5) * 120.0;
            float minor = hairline(min(g1.x, g1.y));
            float major = hairline(min(g2.x, g2.y) - 0.25);
            vec3 rgb = vec3(max(minor * 0.075, major * 0.16)) * uPaper;

            float upp = 644.0 / uBigH;
            float aa = upp / uDpr;
            vec2 u = toAP(p, uBigH);
            float sd = sdAP(u);
            float inside = clamp(0.5 - sd / aa, 0.0, 1.0);

            vec2 corner = vec2(u.x < 401.5 ? -48.0 : 851.0, u.y < 322.0 ? -48.0 : 692.0);
            vec2 dc = abs(u - corner) / upp;
            float reg = max(hairline(dc.x) * step(dc.y, 9.0), hairline(dc.y) * step(dc.x, 9.0));
            rgb = mix(rgb, SIGNAL, reg * 0.85 * uPaper);

            float hp = clamp((uFill - 0.3) / 0.7, 0.0, 1.0);
            float fillLine = 644.0 * (1.0 - hp);
            float below = clamp((u.y - fillLine) / aa + 0.5, 0.0, 1.0);
            float hv = abs(fract((p.x + p.y) / 7.0) - 0.5) * 7.0 * 0.7071;
            float hatch = clamp((mix(0.55, 3.0, uSolid) - hv) * uDpr + 0.5, 0.0, 1.0);
            rgb = mix(rgb, PAPER, inside * below * hatch);
            float pen = exp(-abs(u.y - fillLine) / (5.0 * upp)) * inside * step(0.001, hp) * step(hp, 0.999);
            rgb = mix(rgb, SIGNAL, pen * 0.9);

            // Outline traced clockwise from 12 o'clock, pen head glowing
            float ang = fract(atan(u.x - 401.5, 322.0 - u.y) / (2.0 * PI));
            float trace = clamp(uFill / 0.5, 0.0, 1.0);
            float drawn = step(ang, trace);
            float head = smoothstep(trace - 0.05, trace, ang) * drawn * step(trace, 0.999);
            float ol = clamp(0.5 - (abs(sd) - 0.7 * upp) / aa, 0.0, 1.0) * drawn;
            rgb = mix(rgb, mix(PAPER, SIGNAL, head), ol);

            return mix(rgb, SIGNAL, inside * uStamp);
        }

        void main() {
            vec2 px = screenPx();
            vec3 rgb = vec3(0.0);
            float alpha = 1.0;

            if (uReveal <= 0.0) {
                rgb = sheet(px);
            } else {
                // The sheet is cut into 48px squares that shrink and spin away, each carrying its piece
                const float T = 48.0;
                vec2 tile = floor(px / T);
                vec2 c = (tile + 0.5) * T;
                float h = hash(tile + 31.0);
                float order = length(c) / length(uRes * 0.5) * 0.6 + h * 0.25;
                float k = clamp((uReveal - order) / 0.5, 0.0, 1.0);
                if (k >= 1.0) {
                    alpha = 0.0;
                } else {
                    float s = pow(1.0 - k, 1.6);
                    float a = k * 1.5708 * (h > 0.5 ? 1.0 : -1.0);
                    vec2 src = c + rot(-a) * (px - c) / s;
                    vec2 ls = abs(src - c);
                    float m = max(ls.x, ls.y);
                    if (m > T * 0.5) {
                        alpha = 0.0;
                    } else {
                        rgb = sheet(src);
                        rgb = mix(rgb, SIGNAL, step(T * 0.5 - m, 1.0 / s) * step(0.001, k));
                    }
                }
            }

            rgb += grain() * alpha;
            gl_FragColor = vec4(clamp(rgb, 0.0, alpha), alpha);
        }
    </script>
    <script src="ap-intro-core.js"></script>
    <script>
        APIntro({
            id: '06-plotter',
            frame(s) {
                const E = APIntro.ease, c = APIntro.clamp01;
                const u = { uPaper: c(s.t / 0.6), uSolid: 0, uStamp: 0, uReveal: 0 };
                let hero = 'scale(1.05)';
                if (s.since >= 0) {
                    u.uSolid = E.inOutCubic(c(s.since / 0.35));
                    u.uStamp = c((s.since - 0.4) / 0.15);
                    const r = c((s.since - 0.65) / 1.7);
                    if (r >= 1) return { done: true };
                    u.uReveal = r * 1.45;
                    hero = 'scale(' + (1.05 - 0.05 * E.outExpo(r)) + ')';
                }
                return { u, hero };
            }
        });
    </script>
</body>
</html>
