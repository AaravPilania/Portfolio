<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro 03 — Ink Bleed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro-core.css">
</head>
<body>
    <script id="introFrag" type="x-shader/x-fragment">
        uniform float uReveal;

        void main() {
            vec2 px = screenPx();
            float d = length(px) / length(uRes * 0.5);
            vec2 q = px * 0.0032;
            float warp = fbm(q * 1.7 + 4.0);
            float f = d * 0.9 + (fbm(q + warp * 1.6) - 0.5) * 0.7;
            float R = mix(-0.35, 1.3, uReveal);

            // Tiles caught in the wet edge get dragged outward and pick up the yellow
            float wet = uReveal > 0.0 ? exp(-pow((f - R) * 7.0, 2.0)) : 0.0;
            vec2 dir = px / (length(px) + 1.0);
            apGrid(px - dir * wet * 26.0);
            vec3 rgb = mix(gMark, SIGNAL * gMarkA, wet);

            float hole = 0.0;
            float rim = 0.0;
            if (uReveal > 0.0) {
                hole = clamp((R - f) / 0.0035 + 0.5, 0.0, 1.0);
                rim = clamp((R + 0.014 - f) / 0.0035 + 0.5, 0.0, 1.0) - hole;
            }
            float ink = 1.0 - hole - rim;
            rgb = rgb * ink + SIGNAL * rim;
            float alpha = 1.0 - hole;

            rgb += grain() * ink * (1.0 - gMarkA);
            gl_FragColor = vec4(clamp(rgb, 0.0, alpha), alpha);
        }
    </script>
    <script src="ap-intro-core.js"></script>
    <script>
        APIntro({
            id: '03-ink-bleed',
            grid: true,
            frame(s) {
                const g = APIntro.grid(s);
                const r = APIntro.clamp01(g.since / 1.8);
                if (r >= 1) return { done: true };
                g.u.uReveal = APIntro.ease.inOutSine(r);
                return { u: g.u, hero: 'scale(' + (1.06 - 0.06 * APIntro.ease.outExpo(r)) + ')' };
            }
        });
    </script>
</body>
</html>
