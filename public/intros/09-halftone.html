<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro 09 — Halftone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro-core.css">
</head>
<body>
    <script id="introFrag" type="x-shader/x-fragment">
        uniform float uSolid;
        uniform float uReveal;

        const float P = 8.0;   // halftone screen pitch, CSS px, at the classic 45°

        void main() {
            vec2 px = screenPx();
            float upp = 644.0 / uBigH;
            float aa = upp / uDpr;

            vec2 q = rot(0.7853982) * px / P;
            vec2 cell = floor(q) + 0.5;
            vec2 lp = (q - cell) * P;
            float r = length(lp);
            vec2 cpx = rot(-0.7853982) * (cell * P);

            // Dot size = ink tone; the fill climbs as a soft ramp, so the front reads as a print gradient
            vec2 cu = toAP(cpx, uBigH);
            float shape = clamp(0.5 - sdAP(cu) / (P * upp * 0.8), 0.0, 1.0);
            float fillLine = 824.0 * (1.0 - uFill) - 90.0;
            float tone = shape * mix(0.08, 1.0, smoothstep(fillLine - 90.0, fillLine + 90.0, cu.y));
            float dotCov = clamp((sqrt(tone) * P * 0.74 - r) * uDpr + 0.5, 0.0, 1.0);
            float crisp = clamp(0.5 - sdAP(toAP(px, uBigH)) / aa, 0.0, 1.0);
            float markCov = mix(dotCov, crisp, uSolid);

            vec3 rgb = vec3(0.075) * clamp((P * 0.12 - r) * uDpr + 0.5, 0.0, 1.0);
            rgb = mix(rgb, PAPER, markCov);
            float alpha = 1.0;

            // Reveal: the same screen inverts into holes that swell until the sheet is gone
            if (uReveal > 0.0) {
                float pos = length(cpx) / length(uRes * 0.5) * 0.7 + fbm(cpx * 0.004 + 7.0) * 0.3;
                rgb = mix(rgb, SIGNAL, clamp((uReveal - pos + 0.18) / 0.18, 0.0, 1.0) * markCov);
                float ht = clamp((uReveal - pos) / 0.45, 0.0, 1.0);
                float hr = sqrt(ht) * P * 0.76;
                float hole = ht >= 1.0 ? 1.0 : clamp((hr - r) * uDpr + 0.5, 0.0, 1.0) * step(0.0001, ht);
                float ring = (ht > 0.0 && ht < 1.0) ? clamp((hr + 1.3 - r) * uDpr + 0.5, 0.0, 1.0) - hole : 0.0;
                rgb = rgb * (1.0 - hole - ring) + SIGNAL * ring;
                alpha = 1.0 - hole;
            }

            rgb += grain() * alpha * (1.0 - markCov);
            gl_FragColor = vec4(clamp(rgb, 0.0, alpha), alpha);
        }
    </script>
    <script src="ap-intro-core.js"></script>
    <script>
        APIntro({
            id: '09-halftone',
            frame(s) {
                const E = APIntro.ease, c = APIntro.clamp01;
                if (s.since < 0) return { u: { uSolid: 0, uReveal: 0 }, hero: 'scale(1.06)' };
                const r = c((s.since - 0.45) / 1.7);
                if (r >= 1) return { done: true };
                return {
                    u: { uSolid: E.inOutCubic(c(s.since / 0.3)), uReveal: r * 1.45 },
                    hero: 'scale(' + (1.06 - 0.06 * E.outExpo(r)) + ')'
                };
            }
        });
    </script>
</body>
</html>
