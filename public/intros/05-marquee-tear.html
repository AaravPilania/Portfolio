<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro 05 — Marquee Tear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro-core.css">
</head>
<body>
    <script id="introFrag" type="x-shader/x-fragment">
        uniform float uReveal;

        void main() {
            vec2 px = screenPx();
            vec3 rgb;
            float markA;
            float alpha = 1.0;

            if (uReveal <= 0.0) {
                apGrid(px);
                rgb = gMark;
                markA = gMarkA;
            } else {
                // Rows become marquees: alternate directions, accelerate, streak, then thin to a scanline
                vec2 w = rot(-uRot) * px / uScale;
                float row = floor((w.y + uPitch.y * 0.5) / uPitch.y);
                float rowY = row * uPitch.y;
                float rh = hash(vec2(row, 7.0));
                float dir = mod(row, 2.0) < 0.5 ? 1.0 : -1.0;
                float order = abs(rowY) / (uRes.y * 0.5) * 0.45 + rh * 0.12;
                float rq = clamp((uReveal - order) / 0.9, 0.0, 1.0);

                float speed = 0.7 + rh * 0.6;
                float travel = dir * 1600.0 * pow(rq, 2.4) * speed;
                float blur = min(1600.0 * 2.4 * pow(rq, 1.4) * speed * 0.012, 44.0);

                vec3 acc = vec3(0.0);
                float accA = 0.0;
                for (int i = 0; i < 10; i++) {
                    float o = (float(i) / 9.0 - 0.5) * blur;
                    apGrid(px - vec2(travel + o, 0.0));
                    acc += gMark;
                    accA += gMarkA;
                }
                markA = accA / 10.0;
                rgb = mix(acc / 10.0, SIGNAL * markA, smoothstep(0.1, 0.6, rq));

                float bh = uPitch.y * 0.5 * (1.0 - smoothstep(0.45, 1.0, rq));
                float dy = abs(w.y - rowY);
                if (rq >= 1.0) {
                    alpha = 0.0;
                } else {
                    alpha = clamp((bh - dy) * uDpr + 0.5, 0.0, 1.0);
                    if (rq > 0.45 && bh < 5.0) rgb = SIGNAL;
                }
                rgb *= alpha;
            }

            rgb += grain() * alpha * (1.0 - markA);
            gl_FragColor = vec4(clamp(rgb, 0.0, alpha), alpha);
        }
    </script>
    <script src="ap-intro-core.js"></script>
    <script>
        APIntro({
            id: '05-marquee-tear',
            grid: true,
            frame(s) {
                const g = APIntro.grid(s);
                const r = APIntro.clamp01(g.since / 1.8);
                if (r >= 1) return { done: true };
                g.u.uReveal = r * 1.55;
                return { u: g.u, hero: 'scale(' + (1.06 - 0.06 * APIntro.ease.outExpo(r)) + ')' };
            }
        });
    </script>
</body>
</html>
