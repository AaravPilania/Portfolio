<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro 07 — Block Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro-core.css">
</head>
<body>
    <script id="introFrag" type="x-shader/x-fragment">
        uniform float uReveal;

        const float B = 644.0 / 13.0;

        void main() {
            vec2 px = screenPx();
            float upp = 644.0 / uBigH;
            float aa = upp / uDpr;
            vec2 u = toAP(px, uBigH);

            float ghost = clamp(0.5 - (abs(sdAP(u)) - 0.5 * upp) / aa, 0.0, 1.0);
            vec3 rgb = vec3(0.16) * ghost;
            float alpha = 1.0;

            // The mark is stacked from falling blocks, bottom row first; each block carries its exact slice
            float col = floor(u.x / B);
            if (col >= 0.0 && col < 17.0) {
                float fallU = (uRes.y * 0.5 + uBigH) * upp + 200.0;
                for (int i = 0; i < 13; i++) {
                    float r = float(i);
                    if (sdAP(vec2((col + 0.5) * B, (r + 0.5) * B)) > B * 0.72) continue;
                    float k = (12.0 - r) / 13.0 + hash(vec2(col, r)) * 0.06;
                    float p = clamp((uFill * 1.25 - k) / 0.2, 0.0, 1.0);
                    float top = r * B - (1.0 - p * p) * fallU;
                    float ly = u.y - top;
                    if (ly >= 0.0 && ly < B) {
                        float cov = clamp(0.5 - sdAP(vec2(u.x, r * B + ly)) / aa, 0.0, 1.0);
                        float landed = uFill * 1.25 - k - 0.2;
                        float flash = p >= 1.0 ? clamp(1.0 - landed / 0.12, 0.0, 1.0) : 0.0;
                        rgb = mix(rgb, mix(PAPER, SIGNAL, flash), cov);
                    }
                }
            }

            // Line clear: rows flash from the bottom up, then their blocks pop out from the centre
            if (uReveal > 0.0) {
                float RB = 2.0 * B;
                float rowI = floor(u.y / RB);
                float rowCy = ((rowI + 0.5) * RB - 322.0) / upp;
                float order = (0.5 - rowCy / uRes.y) * 0.9;
                float rq = clamp((uReveal - order) / 0.35, 0.0, 1.0);
                if (rq > 0.0) {
                    float colI = floor(u.x / RB);
                    vec2 bc = vec2((colI + 0.5) * RB, (rowI + 0.5) * RB);
                    float dc = abs((bc.x - 401.5) / upp) / (uRes.x * 0.5);
                    float kb = clamp((rq - 0.3 - dc * 0.35) / 0.35, 0.0, 1.0);
                    rgb = mix(rgb, SIGNAL, smoothstep(0.0, 0.12, rq));
                    if (kb > 0.0) {
                        vec2 lb = abs(u - bc);
                        float hs = (1.0 - kb) * B - 0.6 * upp;
                        if (max(lb.x, lb.y) >= hs) {
                            rgb = vec3(0.0);
                            alpha = 0.0;
                        }
                    }
                }
            }

            rgb += grain() * alpha * (1.0 - ghost);
            gl_FragColor = vec4(clamp(rgb, 0.0, alpha), alpha);
        }
    </script>
    <script src="ap-intro-core.js"></script>
    <script>
        APIntro({
            id: '07-block-drop',
            frame(s) {
                const r = APIntro.clamp01((s.since - 0.4) / 1.4);
                if (r >= 1) return { done: true };
                return {
                    u: { uReveal: s.since >= 0 ? r * 1.3 : 0 },
                    hero: 'scale(' + (1.05 - 0.05 * APIntro.ease.outExpo(r)) + ')'
                };
            }
        });
    </script>
</body>
</html>
