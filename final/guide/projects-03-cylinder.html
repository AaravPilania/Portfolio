<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Lab / 03 Cylinder</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/guide/projects-lab/lab.css">
    <style>
        body { background: #000; }
        .cy-scroll { position: relative; height: 640vh; }
        .cy-stage { position: sticky; top: 0; height: 100vh; overflow: hidden;
            background: radial-gradient(120% 80% at 50% 58%, #15161a 0%, #070708 55%, #000 100%); }
        .cy-head { position: absolute; top: var(--pad); left: var(--pad); right: var(--pad); display: flex; justify-content: space-between; align-items: flex-start; z-index: 3; pointer-events: none; }
        .cy-head h1 { margin: 10px 0 0; font: 600 clamp(28px, 3.4vw, 56px)/0.9 var(--sans); letter-spacing: -0.05em; text-transform: uppercase; }
        .cy-head .cy-hint { margin: 0; text-align: right; color: var(--dim); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; line-height: 1.8; }

        .cy-view { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 42%; touch-action: pan-y; }
        .cy-view.is-drag { cursor: grabbing; }
        .cy-ring { position: absolute; left: 50%; top: 44%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
        .cy-panel { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
        .cy-panel__face, .cy-panel__back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .cy-panel__face { background: var(--ink); overflow: hidden; }
        .cy-panel__face .pl-media { position: absolute; inset: 0; }
        .cy-panel__veil { position: absolute; inset: 0; background: #000; pointer-events: none; will-change: opacity; }
        .cy-panel__cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 10px 12px; font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent); }
        .cy-panel__cap b { color: var(--sig); font-weight: 500; }
        .cy-panel__face::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(244, 242, 234, 0.14); pointer-events: none; }
        .cy-panel.is-front .cy-panel__face::after { box-shadow: inset 0 0 0 1.5px var(--sig); }
        .cy-panel__back { transform: rotateY(180deg); display: grid; place-items: center; background: #0b0b0d;
            background-image: linear-gradient(rgba(244,242,234,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(244,242,234,0.06) 1px, transparent 1px);
            background-size: 16px 16px; box-shadow: inset 0 0 0 1px rgba(244, 242, 234, 0.08); }
        .cy-panel__back span { font: 600 clamp(60px, 8vw, 140px)/1 var(--sans); letter-spacing: -0.06em; color: transparent; -webkit-text-stroke: 1px rgba(255, 237, 41, 0.45); }

        .cy-floor { position: absolute; left: 0; top: 0; pointer-events: none;
            background-image: linear-gradient(rgba(244,242,234,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(244,242,234,0.12) 1px, transparent 1px),
                linear-gradient(rgba(244,242,234,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(244,242,234,0.05) 1px, transparent 1px);
            background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: center;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,0.6) 38%, transparent 68%);
            mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0,0,0,0.6) 38%, transparent 68%); }

        .cy-caption { position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--pad) + 52px); display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 3vw; z-index: 3; pointer-events: none; }
        .cy-count { font: 600 clamp(48px, 7vw, 120px)/0.8 var(--sans); letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
        .cy-count i { font: 500 11px/1 var(--mono); letter-spacing: 0.2em; color: var(--dim); font-style: normal; vertical-align: top; margin-left: 6px; }
        .cy-title { margin: 0; font: 600 clamp(26px, 3.8vw, 64px)/1 var(--sans); letter-spacing: -0.045em; }
        .cy-title-meta { margin-top: 8px; color: var(--dim); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; }
        .cy-title-meta b { color: var(--sig); font-weight: 500; }
        .cy-launch { pointer-events: auto; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 12px 16px 11px; box-shadow: inset 0 0 0 1px var(--rule); transition: background-color 0.2s linear, color 0.2s linear; }
        .cy-launch:hover { background: var(--sig); color: var(--ink); }
        .cy-launch.is-off { opacity: 0.35; pointer-events: none; }
        .cy-swap { display: inline-block; }
        .cy-swap.is-in .pl-roll > span { animation: cyIn 0.7s var(--ease-out) both; animation-delay: calc(var(--i) * 18ms); }
        @keyframes cyIn { from { transform: translate3d(0, 100%, 0); } to { transform: translate3d(0, 0, 0); } }

        .cy-dial { position: absolute; left: 50%; bottom: 14px; width: min(720px, 80vw); height: 22px; transform: translateX(-50%); overflow: hidden; z-index: 3; pointer-events: none;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }
        .cy-dial__ticks { position: absolute; left: 0; top: 0; height: 100%; width: 400%; will-change: transform;
            background-image: linear-gradient(90deg, rgba(244,242,234,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(244,242,234,0.18) 1px, transparent 1px);
            background-size: 90px 100%, 18px 45%; background-repeat: repeat-x; }
        .cy-dial::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--sig); }

        .cy-after { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: var(--pad); }
        .cy-after p { font: italic 300 clamp(32px, 5vw, 90px)/1 var(--serif); margin: 0; }
        .cy-after small { display: block; margin-top: 16px; color: var(--dim); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; }

        @media (prefers-reduced-motion: reduce) { .cy-swap.is-in .pl-roll > span { animation: none; } }
    </style>
</head>
<body>
    <section class="cy-scroll" id="cyScroll">
        <div class="cy-stage">
            <header class="cy-head">
                <div><p class="pl-kicker" style="text-align:left">Slide 03 &mdash; The drum</p><h1>Projects</h1></div>
                <p class="cy-hint">Scroll to turn<br>Drag to spin<br>Click a side panel to bring it round</p>
            </header>
            <div class="cy-view" id="cyView"><div class="cy-ring" id="cyRing"></div></div>
            <div class="cy-caption">
                <div class="cy-count"><span id="cyNo">01</span><i>/ 16</i></div>
                <div><h2 class="cy-title"><span class="cy-swap" id="cyTitle"></span></h2><div class="cy-title-meta" id="cyMeta"></div></div>
                <a class="cy-launch" id="cyLaunch" target="_blank" rel="noopener" data-cursor="LAUNCH">Launch &#8599;</a>
            </div>
            <div class="cy-dial" aria-hidden="true"><div class="cy-dial__ticks" id="cyTicks"></div></div>
        </div>
    </section>
    <section class="cy-after"><div><p>Sixteen turns.</p><small>Scroll back up to unwind the drum</small></div></section>

    <script src="/guide/projects-lab/data.js"></script>
    <script src="/guide/projects-lab/lab.js"></script>
    <script src="/guide/projects-lab/d03-cylinder.js"></script>
</body>
</html>
