    <h1 class="gc-sr">Contact — Ping? Pong!</h1>
    <p class="gc-sr">A week view of a fully booked calendar. The meetings split into tiny time slots, spell out "Ping? Pong!", then stretch and slide to become a dancing figure before being cancelled back into free time.</p>

    <div class="gc-times" id="gcTimes" aria-hidden="true"></div>
    <canvas class="gc-canvas" id="gcCanvas" aria-hidden="true"></canvas>

        <span class="gc-snack__dot" aria-hidden="true"></span>
        <span>Click anywhere for sound</span>
    </div>

    <script src="js/calendar-audio.js"></script>
