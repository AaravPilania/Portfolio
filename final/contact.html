<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact — Pacôme Pertant</title>
    <meta name="description" content="Contact Pacôme Pertant, motion &amp; sound designer. The calendar is full — a week of meetings that turns into a dance.">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:title" content="Contact — Pacôme Pertant">
    <meta property="og:description" content="I'm busy rn. A Google Calendar week that schedules itself into a dance.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="preload" href="data/calendar-dance.bin" as="fetch" crossorigin>
    <link rel="stylesheet" href="css/calendar-contact.css">
</head>

<body class="gc">
    <h1 class="gc-sr">Contact — I'm busy rn</h1>
    <p class="gc-sr">A week view of a fully booked calendar. The meetings split into tiny time slots, spell out "I'm busy rn", then play a short dance clip before settling back into an ordinary week.</p>

    <header class="gc-top">
        <button class="gc-icon gc-menu" type="button" aria-label="Main menu">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <a class="gc-brand" href="contact.html" aria-label="Calendar">
            <svg class="gc-logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
                <rect x="3" y="3" width="34" height="34" rx="5" fill="#1a73e8"/>
                <rect x="9" y="11" width="22" height="20" rx="2" fill="#fff"/>
                <rect x="9" y="11" width="22" height="5" fill="#d2e3fc"/>
                <text x="20" y="28.5" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="11" font-weight="500" fill="#1a73e8">31</text>
            </svg>
            <span class="gc-wordmark">Calendar</span>
        </a>
        <button class="gc-today" type="button">Today</button>
        <div class="gc-nav">
            <button class="gc-icon" type="button" aria-label="Previous week">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
            </button>
            <button class="gc-icon" type="button" aria-label="Next week">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
            </button>
        </div>
        <div class="gc-spacer"></div>
        <button class="gc-view" type="button"><span class="js-view-label">Week</span>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="gc-avatar" aria-hidden="true">P</div>
    </header>

    <div class="gc-days" id="gcDays" aria-hidden="true"></div>
    <div class="gc-times" id="gcTimes" aria-hidden="true"></div>
    <canvas class="gc-canvas" id="gcCanvas" aria-hidden="true"></canvas>

    <div class="gc-snack" id="gcSnack" role="status" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span>Click anywhere to turn on sound</span>
    </div>

    <script src="js/calendar-audio.js"></script>
    <script src="js/calendar-contact.js"></script>
</body>

</html>
