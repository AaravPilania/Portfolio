<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion 03 — Live Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="motion-core.css">
</head>
<body>
    <script src="motion-core.js"></script>
    <script>
    MotionProto({
        id: '03-live-screen',
        css: `
            #cardGradient { opacity: var(--mp-grad, 0) !important; }
            #heroShrinkCard.is-shrunk #heroPortraitCanvas { filter: none !important; }
            .mp-lit #heroShrinkCard.is-shrunk { box-shadow: 0 0 0 1px rgba(255, 246, 222, 0.08), 0 0 90px rgba(255, 244, 214, 0.14), 0 24px 60px rgba(0, 0, 0, 0.6) !important; }
            .mp-lit #heroShrinkCard { -webkit-box-reflect: below 18px linear-gradient(transparent 60%, rgba(255, 255, 255, 0.22)); }
            .mp-lit .hero-marquee-outline-clip .track-line-1 { filter: drop-shadow(0 0 0.7px rgba(18, 19, 22, 0.95)) drop-shadow(0 0 0.7px rgba(18, 19, 22, 0.95)); }
            .mp-lit .hero-marquee-outline-clip .track-line-2 span { -webkit-text-stroke-color: #121316 !important; }
            .mp-room, .mp-glow, .mp-floor { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity; transform-origin: 50% 50%; }
            .mp-room { z-index: 16; background: radial-gradient(closest-side, rgba(3, 3, 5, 0) 21%, rgba(3, 3, 5, 0.5) 44%, rgba(3, 3, 5, 0.86) 78%, rgba(3, 3, 5, 0.9) 100%); }
            .mp-glow { z-index: 3; mix-blend-mode: screen; background: radial-gradient(closest-side, rgba(255, 246, 222, 0.16), rgba(255, 246, 222, 0.05) 55%, rgba(255, 246, 222, 0) 100%); }
            .mp-floor { z-index: 3; mix-blend-mode: screen; background: radial-gradient(closest-side, rgba(255, 244, 214, 0.13), rgba(255, 244, 214, 0) 100%); }
            .mp-grabbing, .mp-grabbing * { user-select: none !important; }
        `,
        mount(S) {
            const doc = S.doc;
            const c01 = MotionProto.clamp01;
            const viewport = doc.querySelector('.sticky-hero-viewport');
            const marquee = doc.getElementById('heroMarquee');
            const outline = doc.getElementById('heroMarqueeOutlineClip');
            const gradient = doc.getElementById('cardGradient');
            const labelText = doc.querySelector('#cursorLabel .js-text-container');

            // Darkness is one oversized gradient that only moves and scales with the card
            const room = S.el('div', 'mp-room', viewport);
            const glow = S.el('div', 'mp-glow', viewport);
            const floor = S.el('div', 'mp-floor', viewport);
            let base = null;
            function sizeLayers() {
                const t = S.target;
                base = { w: t.width, h: t.height };
                room.style.width = t.width * 6 + 'px';
                room.style.height = t.height * 7.5 + 'px';
                glow.style.width = t.width * 2.4 + 'px';
                glow.style.height = t.height * 2.6 + 'px';
                floor.style.width = t.width * 1.7 + 'px';
                floor.style.height = t.height * 0.55 + 'px';
            }

            // Both marquee lines, base + outline clone, driven from one clock per line so they never drift
            function lineCtl(cls, dir) {
                S.win.__marqueeDriven = true;
                const groups = [...marquee.querySelectorAll(cls + ' .marquee-group'), ...outline.querySelectorAll(cls + ' .marquee-group')];
                const anims = groups.map((g) => g.getAnimations()[0]).filter(Boolean);
                if (!anims.length) return null;
                const D = anims[0].effect.getTiming().duration;
                const t = anims[0].currentTime || 0;
                anims.forEach((a) => a.pause());
                return {
                    dir, D, anims, t, rate: 1, skew: 0, hover: 0,
                    tracks: [marquee.querySelector(cls), outline.querySelector(cls)].filter(Boolean),
                    group: groups[0],
                    drag: null,
                };
            }
            let lines = [];
            function initLines() {
                const a = lineCtl('.track-line-1', -1), b = lineCtl('.track-line-2', 1);
                lines = [a, b].filter(Boolean);
                return lines.length === 2;
            }
            initLines();

            function pxPerMs(L) { return L.group.offsetWidth / L.D; }

            function lineAt(x, y) {
                if (!S.s2Active) return null;
                for (const L of lines) {
                    const r = L.tracks[0].getBoundingClientRect();
                    if (y >= r.top - 6 && y <= r.bottom + 6) return L;
                }
                return null;
            }

            const samples = [];
            doc.addEventListener('pointerdown', (e) => {
                const L = lineAt(e.clientX, e.clientY);
                if (!L) return;
                L.drag = { x0: e.clientX, t0: L.t };
                samples.length = 0;
                doc.documentElement.classList.add('mp-grabbing');
                e.preventDefault();
            });
            doc.addEventListener('pointermove', (e) => {
                if (!lines.some((L) => L.drag)) return;
                samples.push({ x: e.clientX, t: performance.now() });
                if (samples.length > 8) samples.shift();
            }, { passive: true });
            function release() {
                const L = lines.find((l) => l.drag);
                if (!L) return;
                let v = 0;
                if (samples.length > 1) {
                    const a = samples[0], b = samples[samples.length - 1];
                    if (performance.now() - b.t < 90 && b.t > a.t) v = (b.x - a.x) / (b.t - a.t);
                }
                L.rate = Math.max(-40, Math.min(40, v / (L.dir * pxPerMs(L))));
                L.drag = null;
                doc.documentElement.classList.remove('mp-grabbing');
            }
            doc.addEventListener('pointerup', release);
            doc.addEventListener('pointercancel', release);

            let prevLabel = null, flick = 0;

            return {
                frame(S) {
                    if (!lines.length && !initLines()) return;
                    if (!base || base.w !== S.target.width) sizeLayers();

                    const dt = S.dt;
                    const lit = c01((S.shrinkP - 0.45) / 0.5);
                    const hovered = S.s2Active ? lineAt(S.mouse.x, S.mouse.y) : null;
                    let energy = 0;

                    for (const L of lines) {
                        L.hover += ((hovered === L ? 1 : 0) - L.hover) * Math.min(1, dt * 8);
                        if (L.drag) {
                            L.t = L.drag.t0 + (S.mouse.x - L.drag.x0) / (L.dir * pxPerMs(L));
                        } else {
                            const push = Math.max(-3, Math.min(6, S.scrollV * 0.0025));
                            const target = (1 - 0.8 * L.hover) + push;
                            L.rate += (target - L.rate) * (1 - Math.exp(-dt * 2.4));
                            L.t += L.rate * dt * 1000;
                        }
                        L.t = ((L.t % L.D) + L.D) % L.D;
                        L.anims.forEach((a) => { a.currentTime = L.t; });

                        // Tape lean: letters tilt against the extra speed, like a flicked ribbon
                        const dv = L.drag && samples.length > 1
                            ? (samples[samples.length - 1].x - samples[0].x) / Math.max(1, samples[samples.length - 1].t - samples[0].t) * 1000
                            : (L.rate - 1) * L.dir * pxPerMs(L) * 1000;
                        const skewTarget = Math.max(-14, Math.min(14, -dv * 0.012));
                        L.skew += (skewTarget - L.skew) * Math.min(1, dt * 9);
                        const tf = 'translate3d(0, 0, 0) skewX(' + L.skew.toFixed(2) + 'deg)';
                        L.tracks.forEach((tr) => tr.style.setProperty('transform', tf, 'important'));
                        energy += Math.min(1, Math.abs(L.rate - 1) / 8);
                    }

                    if (labelText) {
                        const want = lines.some((L) => L.drag) ? '[ FLICK ]' : hovered ? '[ DRAG ]' : null;
                        if (want && prevLabel === null) prevLabel = labelText.textContent;
                        if (want) labelText.textContent = want;
                        else if (prevLabel !== null) { labelText.textContent = prevLabel; prevLabel = null; }
                    }

                    // The shrunk screen is the only light in the room
                    gradient.style.setProperty('--mp-grad', Math.min(0.14, S.shrinkP * 0.2).toFixed(3));
                    doc.documentElement.classList.toggle('mp-lit', lit > 0.2);

                    const c = S.card;
                    const cx = c.left + c.width / 2, cy = c.top + c.height / 2;
                    const vr = viewport.getBoundingClientRect();
                    const k = c.width / base.w;
                    const near = Math.max(0, 1 - Math.hypot(S.mouse.x - cx, S.mouse.y - cy) / (c.width * 0.9));
                    flick += (Math.random() - 0.5) * 0.08 - flick * 0.2;
                    const shine = 0.78 + flick + 0.35 * energy + 0.25 * near;

                    const place = (el, x, y) => {
                        el.style.transform = 'translate3d(' + (x - vr.left - el.offsetWidth / 2) + 'px,' + (y - vr.top - el.offsetHeight / 2) + 'px,0) scale(' + k.toFixed(4) + ')';
                    };
                    place(room, cx, cy);
                    place(glow, cx, cy);
                    place(floor, cx, c.bottom + 18 + base.h * 0.18 * k);
                    room.style.opacity = (lit * (1 - 0.35 * energy)).toFixed(3);
                    glow.style.opacity = (lit * Math.min(1.4, shine)).toFixed(3);
                    floor.style.opacity = (lit * Math.min(1.3, shine)).toFixed(3);
                }
            };
        }
    });
    </script>
</body>
</html>
