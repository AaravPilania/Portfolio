<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

    <title>Projects — Aarav Pilania</title>
    <meta name="description" content="Selected works, digital artifacts, and creative development experiments by Aarav Pilania." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site-nav.css">
    <link rel="stylesheet" href="/css/sponge-carousel.css">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/js/page-transition.js"></script>
    <script src="/js/page-title.js" defer></script>

    <style>
        @font-face {
            font-display: swap;
            font-family: 'PP-Mori';
            src: url('/fonts/PPMori-SemiBold.woff') format('woff');
        }

        @font-face {
            font-family: 'Brier';
            src: url('/fonts/Brier-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --color--dark-bg: #000000 !important;
            --signal: #FFED29;
            --font-mono: 'IBM Plex Mono', 'Sometype Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
            font-family: 'PP-Mori', sans-serif;
            overflow: hidden;
            cursor: none;
            width: 100%;
            height: 100%;
        }

        a, button {
            cursor: none;
        }

        /* Studio Custom Cursor Dot */
        .site-cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999999 !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease, opacity 0.2s ease;
            will-change: transform;
        }
    </style>
</head>

<body>
    <!-- Persistent White Cursor Dot -->
    <div class="site-cursor-dot" id="cursorDot"></div>

    <!-- Boutique Site Navigation Pill -->
    <header class="ap-nav">
        <div class="ap-nav__scrim"></div>
        <nav class="ap-nav__pill" aria-label="Main">
            <div class="ap-nav__bar">
                <button class="ap-nav__hit" type="button" tabindex="-1" aria-hidden="true"></button>
                <a class="ap-nav__mark" href="/" aria-label="Aarav Pilania, home">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803 644" aria-hidden="true">
                        <path fill="currentColor" fill-rule="evenodd" d="M 0 644 L 98 644 L 99 359 L 352 359 L 353 644 L 468 644 L 469 440 L 706 440 L 706 341 L 803 339 L 803 95 L 711 94 L 711 0 L 411 0 L 410 95 L 352 94 L 352 0 L 100 0 L 99 95 L 0 95 Z M 468 95 L 662 94 L 663 141 L 712 143 L 712 292 L 663 293 L 662 341 L 469 341 Z M 99 95 L 352 94 L 353 253 L 100 254 Z" />
                    </svg>
                </a>
                <span class="ap-nav__msg" aria-hidden="true">Selected works index</span>
                <button class="ap-nav__burger" type="button" aria-expanded="false" aria-controls="apNavMenu" aria-label="Open menu"><i></i><i></i><i></i></button>
            </div>
            <div class="ap-nav__menu" id="apNavMenu">
                <ul class="ap-nav__list">
                    <li><a class="ap-nav__item" href="/" data-scroll="projects" style="--i:0">
                        <svg class="ap-nav__ico" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="4" y="0" width="2" height="2" /><rect x="6" y="2" width="2" height="2" /><rect x="0" y="4" width="10" height="2" /><rect x="6" y="6" width="2" height="2" /><rect x="4" y="8" width="2" height="2" /></g></svg>
                        <span class="ap-nav__t">Work</span></a></li>
                    <li><a class="ap-nav__item" href="/about" style="--i:1">
                        <svg class="ap-nav__ico" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="4" y="0" width="2" height="2" /><rect x="6" y="2" width="2" height="2" /><rect x="0" y="4" width="10" height="2" /><rect x="6" y="6" width="2" height="2" /><rect x="4" y="8" width="2" height="2" /></g></svg>
                        <span class="ap-nav__t">About</span></a></li>
                    <li><a class="ap-nav__item is-active" href="/projects" style="--i:2">
                        <svg class="ap-nav__ico" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="4" y="0" width="2" height="2" /><rect x="6" y="2" width="2" height="2" /><rect x="0" y="4" width="10" height="2" /><rect x="6" y="6" width="2" height="2" /><rect x="4" y="8" width="2" height="2" /></g></svg>
                        <span class="ap-nav__t">Projects</span></a></li>
                    <li><a class="ap-nav__item" href="https://github.com/AaravPilania" target="_blank" rel="noopener noreferrer" style="--i:3">
                        <svg class="ap-nav__ico" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="4" y="0" width="2" height="2" /><rect x="8" y="2" width="2" height="4" /><rect x="5" y="3" width="2" height="2" /><rect x="3" y="5" width="2" height="2" /><rect x="0" y="8" width="2" height="2" /><rect x="1" y="7" width="2" height="2" /></g></svg>
                        <span class="ap-nav__t">GitHub</span>
                    </a></li>
                    <li><a class="ap-nav__item" href="/contact" data-nav="contact" data-no-swup style="--i:4">
                        <svg class="ap-nav__ico" viewBox="0 0 10 10" aria-hidden="true"><g fill="currentColor"><rect x="4" y="0" width="2" height="2" /><rect x="6" y="2" width="2" height="2" /><rect x="0" y="4" width="10" height="2" /><rect x="6" y="6" width="2" height="2" /><rect x="4" y="8" width="2" height="2" /></g></svg>
                        <span class="ap-nav__t">Contact</span></a></li>
                </ul>
                <div class="ap-nav__actions" style="--i:4">
                    <a class="ap-nav__btn ap-nav__btn--ghost" href="/contact" data-intent="form" data-no-swup style="--i:4">Get in touch<svg class="ap-nav__btn-a" viewBox="0 0 7 8" aria-hidden="true"><path fill="currentColor" d="M7.002.499v7h-1V2.206L.707 7.501 0 6.794l5.295-5.295H.002v-1h7Z" /></svg></a>
                </div>
            </div>
        </nav>
    </header>

    <!-- SPONGE CAROUSEL VIEWPORT -->
    <main class="sponge-viewport" id="spongeViewport" aria-label="Selected Works Sponge Carousel">
        <!-- Parallax Background Grid -->
        <div class="sponge-grid-bg" id="spongeGridBg"></div>

        <!-- Top Status Bar -->
        <div class="sponge-top-bar">
            <div class="sponge-top-title">
                <span class="sponge-top-dot"></span>
                <span>AARAV PILANIA // SELECTED WORKS ARCHIVE</span>
            </div>
            <div>
                <span>VELOCITY DYNAMICS // 12 ARTIFACTS</span>
            </div>
        </div>

        <!-- Center Compression Lens Markers -->
        <div class="sponge-lens-guide" id="spongeLensGuide" aria-hidden="true">
            <span class="sponge-lens-mark">SPONGE CORE</span>
            <span class="sponge-lens-line"></span>
            <span class="sponge-lens-mark">LENS AXIS</span>
        </div>

        <!-- Interactive Carousel Stage & Track -->
        <div class="sponge-stage" id="spongeStage" role="region" aria-label="Interactive Project Carousel">
            <div class="sponge-track" id="spongeTrack"></div>
        </div>

        <!-- Floating Navigation Arrows -->
        <button class="sponge-nav-arrow sponge-nav-arrow--prev" id="spongePrev" type="button" aria-label="Previous project">
            <svg viewBox="0 0 16 16"><path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>
        </button>
        <button class="sponge-nav-arrow sponge-nav-arrow--next" id="spongeNext" type="button" aria-label="Next project">
            <svg viewBox="0 0 16 16"><path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/></svg>
        </button>

        <!-- Tactile Bottom HUD with Velocity Sponge Gauge -->
        <div class="sponge-hud">
            <div class="sponge-hud-left">
                <span class="sponge-hud-index" id="spongeHudIndex">[ 01 / 12 ]</span>
                <span class="sponge-hud-name" id="spongeHudName">GARGANTUA</span>
            </div>

            <div class="sponge-gauge" aria-label="Scroll velocity sponge compression gauge">
                <span class="sponge-gauge-label">SPONGE COMPRESSION</span>
                <div class="sponge-gauge-bar">
                    <div class="sponge-gauge-fill" id="spongeGaugeFill"></div>
                </div>
                <span class="sponge-gauge-val" id="spongeGaugeVal">0 PX/S</span>
            </div>

            <div class="sponge-hud-right">
                <span class="sponge-hud-hint">SCROLL / DRAG / FLICK</span>
                <a href="/contact" class="sponge-hud-link">Available for freelance &rarr;</a>
            </div>
        </div>
    </main>

    <!-- Dependencies & Logic -->
    <script src="/js/site-nav.js"></script>
    <script src="/js/pixel-bug.js"></script>
    <script src="/js/sponge-carousel.js"></script>
    <script>
        // Custom white dot cursor
        (function() {
            const dot = document.getElementById('cursorDot');
            window.addEventListener('mousemove', (e) => {
                if (dot) dot.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            });
            document.addEventListener('mouseover', (e) => {
                if (!dot) return;
                if (e.target.closest('a, button, .sponge-card, .sponge-nav-arrow')) {
                    dot.style.width = '16px';
                    dot.style.height = '16px';
                } else {
                    dot.style.width = '8px';
                    dot.style.height = '8px';
                }
            });
        })();
    </script>
</body>

</html>
